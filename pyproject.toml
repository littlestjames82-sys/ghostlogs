[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlogs"
version = "0.1.0"
description = "Log slicer for GhostSlice: error windows, deduped repeats, and a token-budgeted incident pack from a local log file"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "logs", "incident", "agents"]
dependencies = []

[project.scripts]
ghostlogs = "ghostlogs.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
